version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CLIENT_URL=http://localhost:5173
    restart: unless-stopped
    networks:
      - kniffel-network

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    ports:
      - '5173:5173'
    environment:
      - VITE_SERVER_URL=http://localhost:3000
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - kniffel-network

networks:
  kniffel-network:
    driver: bridge
